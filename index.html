// ─── APP LOGIC ───────────────────────────────────────
function makeSong(){ return { id: idCounter++, name: '', artist: '', art: null, bpm: 120, ts: 4, tsd: 4, notes: '', sections: [], created: Date.now(), autoNumber:true, audio:null, shareCode:null, countIn:'all' }; }
function currentSong(){ if(sharedSong) return sharedSong; return library.find(s => s.id === currentSongId) || null; }

// Ensure older saved songs/sections have the newer fields
function migrateSong(song){
  if(!song) return song;
  if(song.autoNumber === undefined) song.autoNumber = true;
  if(song.artist === undefined) song.artist = '';
  if(song.art === undefined) song.art = null;   // cover art, stored as a downscaled JPEG data URL
  // old data stored only a numerator; 6 and 7 were the /8 options, everything else /4
  if(song.tsd === undefined) song.tsd = (song.ts === 6 || song.ts === 7) ? 8 : 4;
  if(song.audio === undefined) song.audio = null;
  if(song.shareCode === undefined) song.shareCode = null; // Firestore short-link code (null = not published)
  if(song.countIn === undefined) song.countIn = 'all';    // count-in: 'all' | 'sections' | 'off'
  if(song.playheadMode === undefined) song.playheadMode = 'cue'; // 'cue' = stretch between cue points, 'bpm' = strict tempo
  // a local audio-file URL can't survive a reload — drop the dead blob ref, keep cues
  if(song.audio && song.audio.type === 'file') song.audio = null;
  (song.sections||[]).forEach(s => {
    if(s.id === undefined)   s.id = idCounter++; // stable id (used for fills-collapse UI state)
    if(s.mod === undefined)  s.mod = null;   // null | 'pre' | 'post'
    if(s.time === undefined) s.time = null;  // cue point in seconds (audio sync)
    if(s.num === undefined)  s.num = null;   // manual instance number (used when auto-numbering is off)
    if(s.ts === undefined)   s.ts = null;    // per-section time-sig override: numerator (null = inherit song)
    if(s.tsd === undefined)  s.tsd = null;   // per-section time-sig override: denominator (null = inherit song)
    if(s.color === undefined) s.color = null;// custom per-section color override (null = use type/modifier color)
    if(s.oddAt === undefined) s.oddAt = null;// which bar is the short 'odd' bar (null = the last one)
    if(s.oddSkip === undefined) s.oddSkip = false;// true = the short bar is a pickup, left out of the bar count
    // the old "Pre-Chorus" type is gone — fold it into a Chorus flagged "pre"
    if(s.typeId === 'pre'){ s.typeId = 'chorus'; if(!s.mod) s.mod = 'pre'; }
    if(s.repeats === undefined) s.repeats = 1;
    // fills: array of {start16, len16, notes} — position & length in 16th-notes from the section start
    const d0 = s.tsd || song.tsd || 4, n0 = s.ts || song.ts || 4;
    const spb0 = n0 * 16 / d0;   // 16ths per bar
    const s16b = 16 / d0;        // 16ths per beat
    if(s.fills === undefined){
      if(s.fill){
        const len = Math.min(s.fill.len||2, n0);
        const bar = Math.max(1, s.bars||1), beat = Math.max(1, n0 - len + 1);
        s.fills = [{ start16: (bar-1)*spb0 + (beat-1)*s16b, len16: Math.max(1, Math.round(len*s16b)), notes: s.fill.notes||'' }];
      } else s.fills = [];
    }
    // convert any older beat-based fills {bar,beat,len} to 16th-based
    s.fills.forEach(f => {
      if(f.start16 === undefined){
        const bar = f.bar||1, beat = f.beat||1, len = f.len||2;
        f.start16 = (bar-1)*spb0 + (beat-1)*s16b;
        f.len16 = Math.max(1, Math.round(len*s16b));
      }
      delete f.bar; delete f.beat; delete f.len;
    });
    delete s.fill;
  });
  return song;
}

window.showView = function(v){
  if(v !== 'editor' && fillsIdx != null) window.closeFills();
  document.getElementById('view-library').classList.toggle('active', v==='library');
  document.getElementById('view-editor').classList.toggle('active', v==='editor');
  document.getElementById('view-shared').classList.toggle('active', v==='shared');
}

// ─── SHAREABLE LINKS (self-contained, no backend) ────
// The whole chart is encoded into the URL hash, so any link works on static hosting
// (GitHub Pages etc.) with no login required to view.
function b64urlEncode(str){
  return btoa(unescape(encodeURIComponent(str))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function b64urlDecode(b64){
  b64 = b64.replace(/-/g,'+').replace(/_/g,'/');
  while(b64.length % 4) b64 += '=';
  return decodeURIComponent(escape(atob(b64)));
}

function genShareCode(){ return Math.random().toString(36).slice(2,9); } // 7-char base36
function shareableChart(song){
  const payload = JSON.parse(JSON.stringify(song));
  delete payload.id; delete payload.created; delete payload.shareCode;
  if(payload.audio && payload.audio.type === 'file') payload.audio = null; // a local file can't travel in a link
  return payload;
}

// Publish (or refresh) a chart to the public `sharedCharts` collection → returns its short code, or null on failure.
async function ensureSharePublished(song){
  if(!currentUser || sharedSong || !song) return null;     // only publish your own charts
  try {
    const code = song.shareCode || genShareCode();
    await setDoc(doc(db, 'sharedCharts', code), { chart: shareableChart(song), updated: Date.now(), owner: currentUser.uid });
    if(song.shareCode !== code){ song.shareCode = code; window.save(); }
    return code;
  } catch(e){ console.warn('Share publish failed — check Firestore rules for sharedCharts', e); return null; }
}

window.shareSong = async function(){
  const song = currentSong(); if(!song) return;
  window.saveSongMeta();
  let link;
  const code = await ensureSharePublished(song);
  if(code){
    link = location.origin + location.pathname + '#c/' + code;
    history.replaceState(null, '', '#c/' + code);
  } else {
    // fallback: self-contained long link (works with no login / no Firestore rules)
    link = location.origin + location.pathname + '#s=' + b64urlEncode(JSON.stringify(shareableChart(song)));
  }
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(link).then(
      () => showToast('Link copied'),
      () => window.prompt('Copy this shareable link:', link)
    );
  } else {
    window.prompt('Copy this shareable link:', link);
  }
}

// On load: if the URL is a share link, show the read-only viewer.
// Supports short links (#c/<code>, fetched from Firestore) and self-contained links (#s=<data>).
function checkSharedLink(){
  const h = location.hash || '';
  let m;
  if((m = h.match(/^#c\/([\w-]+)$/))){ pendingShareCode = m[1]; return true; } // resolved after auth
  if((m = h.match(/^#s=(.+)$/))){
    try {
      openSharedChart(migrateSong(JSON.parse(b64urlDecode(m[1]))), 'shared');
      return true;
    } catch(e){ console.warn('Bad share link', e); fallthroughToApp(); return false; }
  }
  return false;
}

async function loadSharedByCode(code){
  try {
    const snap = await getDoc(doc(db, 'sharedCharts', code));
    if(snap.exists()){
      openSharedChart(migrateSong(snap.data().chart || snap.data()), 'shared-' + code);
    } else {
      showToast('That shared chart no longer exists', 'error'); fallthroughToApp();
    }
  } catch(e){ console.warn('Could not load shared chart (Firestore rules?)', e); showToast('Could not load shared chart', 'error'); fallthroughToApp(); }
}

function openSharedChart(song, id){
  song.id = id;
  if(song.audio && song.audio.type === 'file') song.audio = null; // a shared local file can't play
  sharedSong = song;
  renderSharedView();
}

function renderSharedView(){
  const song = sharedSong; if(!song) return;
  document.getElementById('shared-title').textContent = song.name || 'Untitled Song';
  const totalBars = song.sections.reduce((a,s)=>a+(s.bars*s.repeats),0);
  document.getElementById('shared-meta').textContent =
    `${song.bpm} BPM · ${song.ts}/${song.tsd||4} · ${song.sections.length} sections · ${fmtBars(totalBars)} bars`
    + (song.audio && song.audio.type==='youtube' ? ' · ♪ track' : '');

  const nums = computeInstanceNumbers(song);
  document.getElementById('shared-chart').innerHTML = song.sections.map((sec,i) => {
    const ec = effColor(sec);
    const n = (song.autoNumber !== false ? nums[i] : (sec.num||0));
    const numHtml = n ? `<span class="sv-num" style="color:${ec}">${n}</span>` : '';
    const fill = (sec.fills && sec.fills.length) ? `<span class="sv-fill">🥁 ${sec.fills.length} fill${sec.fills.length>1?'s':''} · bar ${sec.fills.slice().sort((a,b)=>a.bar-b.bar).map(f=>f.bar).join(', ')}</span>` : '';
    return `
      <div class="sv-row" style="animation-delay:${i*0.04}s">
        <div class="sv-bar" style="background:${ec}"></div>
        <div class="sv-body">
          <div class="sv-row1">
            <span class="sv-name" style="color:${ec}">${esc(baseLabel(sec))}</span>${numHtml}
            <span class="sv-meta">${fill} ${barsLabel(effTS(song,sec), sec.bars)} ${sec.repeats>1?'×'+sec.repeats:''} · ${tsLabel(song,sec)}</span>
          </div>
          ${sec.notes ? `<div class="sv-notes">${esc(sec.notes)}</div>` : ''}
        </div>
      </div>`;
  }).join('');

  pendingShareHash = false;
  document.getElementById('view-auth').classList.remove('active');
  window.showView('shared');
}

window.copySharedToLibrary = function(){
  if(!sharedSong) return;
  const copy = JSON.parse(JSON.stringify(sharedSong));
  copy.id = idCounter++; copy.created = Date.now(); copy.shareCode = null; // a copy gets its own link

// ── LIBRARY GRID ──────────────────────────────────────
// A song with no uploaded art gets a cover built from its own chart:
// the section colours as raked bands, sized by how long each section runs.
function songHash(song){
  const s = (song.name || '') + '|' + (song.artist || '') + '|' + song.id;
  let h = 0;
  for(let k = 0; k < s.length; k++) h = (h * 31 + s.charCodeAt(k)) | 0;
  return Math.abs(h);
}

function generatedCover(song){
  const secs = song.sections || [];
  if(!secs.length) return 'linear-gradient(148deg,#232019 0%,#100e0c 100%)';
  const h = songHash(song);
  const angle = -(8 + h % 30);          // each chart rakes at its own angle
  const total = secs.reduce((a,s)=>a+(s.bars*s.repeats),0) || 1;
  let y = 0, bands = '';
  secs.forEach(s => {
    const bh = (s.bars*s.repeats)/total*150;
    bands += '<rect x="-60" y="'+y.toFixed(2)+'" width="220" height="'+(bh+.6).toFixed(2)+'" fill="'+effColor(s)+'"/>';
    y += bh;
  });
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none">'
            + '<defs><linearGradient id="v" x1="0" y1="0" x2="0.35" y2="1">'
            + '<stop offset="0" stop-color="#100e0c" stop-opacity=".45"/>'
            + '<stop offset="0.55" stop-color="#100e0c" stop-opacity=".7"/>'
            + '<stop offset="1" stop-color="#100e0c" stop-opacity=".93"/>'
            + '</linearGradient></defs>'
            + '<rect width="100" height="100" fill="#100e0c"/>'
            + '<g opacity="0.5" transform="rotate(' + angle + ' 50 50) translate(0,-26)">' + bands + '</g>'
            + '<rect width="100" height="100" fill="url(#v)"/></svg>';
  return "url('data:image/svg+xml," + encodeURIComponent(svg) + "')";
}

function coverImage(song){
  return song.art ? "url('" + song.art + "')" : generatedCover(song);
}

function ytThumb(id, res){ return 'https://img.youtube.com/vi/' + id + '/' + res + '.jpg'; }

// Cover priority: uploaded art > the linked YouTube thumbnail > a cover drawn from the chart.
// The chart cover paints immediately; the thumbnail swaps in once it has loaded, so the grid
// never waits on the network and never flashes empty.
function applyCover(el, song){
  el.style.backgroundImage = coverImage(song);
  if(song.art) return;
  const yt = song.audio && song.audio.type === 'youtube' && song.audio.videoId;
  if(!yt) return;
  const id = song.audio.videoId;
  // Not every video has a maxres still, and an unavailable video answers every size with the
  // same 120x90 grey placeholder — so measure before swapping, and keep the chart cover if
  // there's no real thumbnail to be had.
  const probe = (res, onMiss) => {
    const im = new Image();
    im.onload = () => {
      if(im.naturalWidth > 120) el.style.backgroundImage = "url('" + ytThumb(id, res) + "')";
      else onMiss();
    };
    im.onerror = onMiss;
    im.src = ytThumb(id, res);
  };
  probe('maxresdefault', () => probe('mqdefault', () => {}));
}

// vertical section preview — dots shrink so a long chart still fits the tile
function coverDots(secs){
  if(!secs.length) return '';
  let list = secs;
  if(list.length > 28){
    const step = list.length / 28;
    list = Array.from({length:28}, (_,k) => secs[Math.floor(k*step)]);
  }
  const n = list.length;
  const size = n <= 12 ? 7 : n <= 20 ? 5.5 : 4.5;
  const gap  = n <= 12 ? 4 : n <= 20 ? 3 : 2;
  return list.map((s,k) =>
    '<div class="tile-dot" style="width:'+size+'px;height:'+size+'px;background:'+effColor(s)
    + (k ? ';margin-top:'+gap+'px' : '') + '"></div>').join('');
}

function libDate(t){
  if(!t) return '';
  return new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
}

window.renderLibrary = function(){
  const list = document.getElementById('song-list');
  const empty = document.getElementById('lib-empty');
  list.innerHTML = '';
  if(!library.length){ empty.style.display='block'; return; }
  empty.style.display = 'none';
  [...library].reverse().forEach((song, i) => {
    const secs = song.sections || [];
    const totalBars = secs.reduce((a,s)=>a+(s.bars*s.repeats),0);
    const name = song.name || 'Untitled';
    const card = document.createElement('article');
    card.className = 'tile';
    card.tabIndex = 0;
    card.dataset.id = song.id;
    card.style.animationDelay = Math.min(i*0.03, 0.36) + 's';
    card.innerHTML = `
      <div class="tile-art"></div>
      <div class="tile-scrim"></div>
      <div class="tile-acts">
        <button class="tile-act danger" title="Delete" aria-label="Delete ${esc(name)}" onclick="event.stopPropagation();deleteSongById(${song.id})">${ico('x')}</button>
      </div>
      <div class="tile-top">
        <h3 class="tile-title"><span class="tt-stroke" aria-hidden="true">${esc(name)}</span><span class="tt-fill">${esc(name)}</span></h3>
        ${song.artist ? `<div class="tile-artist">${esc(song.artist)}</div>` : ''}
      </div>
      <div class="tile-bot">
        <div class="tile-meta">${song.bpm} BPM · ${Math.round(totalBars)} bars<br>${libDate(song.created)}</div>
        <div class="tile-dots">${coverDots(secs)}</div>
      </div>`;
    applyCover(card.querySelector('.tile-art'), song);

// ─── LABEL HELPERS (numbering + pre/post modifiers) ──
function baseLabel(sec){
  const t = TM[sec.typeId];
  const name = t ? t.label : 'Section';
  if(sec.mod === 'pre')  return 'Pre-'  + name;
  if(sec.mod === 'post') return 'Post-' + name;
  return name;
}
// Map each section index -> instance number, but only when that base label repeats
function computeInstanceNumbers(song){
  const counts = {}, totals = {};
  song.sections.forEach(s => { const k = baseLabel(s); totals[k] = (totals[k]||0) + 1; });
  return song.sections.map(s => {
    const k = baseLabel(s);
    counts[k] = (counts[k]||0) + 1;
    return totals[k] > 1 ? counts[k] : 0; // 0 = no number shown
  });
}
function sectionDisplay(song, i){
  const sec = song.sections[i];
  // auto: computed instance number; manual (toggle off): the section's own num field
  const num = (song.autoNumber !== false) ? computeInstanceNumbers(song)[i] : (sec.num || 0);
  return baseLabel(sec) + (num ? ' ' + num : '');
}

// ─── TIME SIGNATURE HELPERS ──
// effective time sig for a section (falls back to the song default), as {n, d}
function effTS(song, sec){
  return { n: (sec && sec.ts) || song.ts || 4, d: (sec && sec.tsd) || song.tsd || 4 };
}
function tsLabel(song, sec){ const {n,d} = effTS(song, sec); return n + '/' + d; }
// ms per bar: a bar holds n notes of value 1/d; a 1/d note = (4/d) quarter notes; quarter = 60000/bpm
function barMsFor(song, sec){ const {n,d} = effTS(song, sec); return n * (4/d) * (60000 / song.bpm); }
function sectionHasTSOverride(sec){ return sec.ts != null || sec.tsd != null; }
// ── 16th-note geometry for fills ──
function sixteenthsPerBar(ets){ return ets.n * 16 / ets.d; }   // n beats × (16/d) 16ths per beat
// bars can be fractional (4.25) — print without trailing zeros
function fmtBars(n){ return Number(n).toFixed(2).replace(/\.?0+$/,''); }
function sixteenthsPerBeat(ets){ return 16 / ets.d; }
// A fractional bar count means the section ends on a short "odd" bar — e.g. 4.5 bars of 4/4
// is 4 bars plus a 2/4 bar. These derive that odd bar so it can be drawn, counted and
// counted-in as a real measure instead of a smear of leftover time.
function oddBarBeats(ets, bars){
  const frac = bars - Math.floor(bars + 1e-9);
  if(frac < 1e-9) return 0;                       // whole bars, no odd bar
  return Math.max(1, Math.round(frac * ets.n));   // beats in that trailing bar
}
function wholeBarsOf(bars){ return Math.floor(bars + 1e-9); }
// The bars of a section, in order, as {start16,len16,beats,isOdd,num}. The odd bar defaults to
// last but can sit anywhere via sec.oddAt, so an extra beat can fall mid-phrase. `num` is the
// bar's number in the count; skipOdd makes the short bar a pickup with no number of its own,
// so the bar after it counts as 1.
function barLayout(ets, bars, oddAt, skipOdd){
  const spb = sixteenthsPerBar(ets), s16b = sixteenthsPerBeat(ets);
  const whole = wholeBarsOf(bars), ob = oddBarBeats(ets, bars);
  const count = whole + (ob ? 1 : 0);
  const oddIdx = ob ? Math.max(0, Math.min(oddAt == null ? count - 1 : oddAt, count - 1)) : -1;
  const out = []; let pos = 0, num = 1;
  for(let k = 0; k < count; k++){
    const isOdd = k === oddIdx;
    const len = isOdd ? ob * s16b : spb;
    out.push({ start16: pos, len16: len, beats: isOdd ? ob : ets.n, isOdd, num: isOdd && skipOdd ? null : num++ });
    pos += len;
  }
  return out;
}
function secLayout(song, sec){ return barLayout(effTS(song, sec), sec.bars, sec.oddAt, sec.oddSkip); }
// bars that carry a number — a skipped pickup isn't one of them
function countedBars(layout){ return layout.reduce((a, b) => a + (b.num == null ? 0 : 1), 0); }
// does this section have a short bar that could be left out of the count?
function hasOddBar(song, sec){ return oddBarBeats(effTS(song, sec), sec.bars) > 0; }
// "8 bars" / "4 bars + 2 beats"
function barsLabel(ets, bars){
  const w = wholeBarsOf(bars), ob = oddBarBeats(ets, bars);
  if(!ob) return `${w} bars`;
  if(!w)  return `${ob} beat${ob!==1?'s':''}`;
  return `${w} bars + ${ob} beat${ob!==1?'s':''}`;
}
// where a fill sits, in words. A pickup bar has no number, so it's named instead.
function barBeatLabel(bb, lower){
  const b = bb.bar == null ? (lower ? 'pickup' : 'Pickup') : (lower ? 'bar ' : 'Bar ') + bb.bar;
  return b + ' \u00b7 beat ' + bb.beat;
}
function msPer16(song){ return (60000 / song.bpm) / 4; }       // a 16th note is always a quarter ÷ 4
// where (bar, beat) a fill's start16 lands, for labels
function fillBarBeat(ets, start16, layout){
  const spb = sixteenthsPerBar(ets), s16b = sixteenthsPerBeat(ets);
  // with an odd bar in play the bars aren't uniform, so walk the real layout
  if(layout && layout.length){
    for(let k = 0; k < layout.length; k++){
      const b = layout[k];
      if(start16 < b.start16 + b.len16 - 1e-9 || k === layout.length - 1){
        const off = Math.max(0, start16 - b.start16);
        return { bar:b.num === undefined ? k+1 : b.num, beat: Math.floor(off/s16b)+1, sub: Math.round((off % s16b)/(s16b/4)) };
      }
    }
  }
  const bar = Math.floor(start16 / spb) + 1;
  const beat = Math.floor((start16 % spb) / s16b) + 1;
  const sub = Math.round((start16 % s16b) / (s16b/4));   // 0..3 sixteenth within the beat (for "e & a")
  return { bar, beat, sub };
}
function fmtFillLen(ets, len16){
  const s16b = sixteenthsPerBeat(ets);
  const beats = len16 / s16b;
  return Number.isInteger(beats) ? `${beats} beat${beats!==1?'s':''}` : `${beats.toFixed(2).replace(/0+$/,'').replace(/\.$/,'')} beats`;
}

let animateChartOnce = false; // true only right after opening a song, so the bounce-in plays once
window.renderChart = function(){
  const animate = animateChartOnce; animateChartOnce = false;
  const song = currentSong();
  const list = document.getElementById('chart-list');
  const hint = document.getElementById('drop-hint');
  if(!song){ list.innerHTML=''; return; }
  // remember scroll so an edit never jumps the chart back to the top (the editor itself scrolls on phones)
  const scrollers = ['chart-area','ed-main','view-editor'].map(id => document.getElementById(id)).filter(Boolean);
  const savedTops = scrollers.map(el => el.scrollTop);
  hint.style.display = song.sections.length ? 'none' : 'block';
  list.innerHTML = '';

  const nums = computeInstanceNumbers(song);
  const hasAudio = !!song.audio;
  // HTML drag and drop doesn't exist on touch screens — sections move from the ⋯ menu there
  const canDrag = matchMedia('(pointer:fine)').matches;
  song.sections.forEach((sec, i) => {
    const t = TM[sec.typeId];
    const ec = effColor(sec);                 // honours custom colour + pre/post modifier
    const ets = effTS(song, sec);
    const custom = sectionHasTSOverride(sec);
    // auto-numbering on → read-only computed number; off → an editable number
    const num = (song.autoNumber !== false)
      ? (nums[i] ? `<span class="lg-num">${nums[i]}</span>` : '')
      : `<input class="lg-num-input" type="number" inputmode="numeric" min="1" value="${sec.num??''}" placeholder="#" aria-label="Section number" onchange="updateNum(${i},this.value)">`;
    const mod = sec.mod === 'pre' ? 'Pre-' : sec.mod === 'post' ? 'Post-' : '';
    const cue = !hasAudio ? ''
      : sec.time != null
        ? `<span class="lg-cue" title="Cue — type an exact time like 2:39.42, or select the section and press , / . to nudge it">
             <button type="button" onclick="seekEditorToSection(${i})" title="Jump the track here" aria-label="Jump the track here">${ico('cue')}</button>
             <input type="text" inputmode="decimal" value="${fmtCue(sec.time)}" aria-label="Cue time" onchange="setCueText(${i},this.value)" onkeydown="if(event.key==='Enter')this.blur()">
             <button type="button" class="lg-cue-x" onclick="clearCue(${i})" title="Clear cue" aria-label="Clear cue">${ico('x')}</button>
           </span>`
        : `<button type="button" class="chip" onclick="setCueHere(${i})" title="Cue this section at the current play time">${ico('cue')}Cue</button>`;
    const nf = sec.fills.length;
    const el = document.createElement('div');
    el.className = 'section-block' + (animate ? ' anim-in' : '');
    if(animate) el.style.animationDelay = Math.min(i * 0.03, 0.3) + 's';
    el.draggable = canDrag;
    el.dataset.idx = i;
    el.style.setProperty('--sec', ec);
    el.style.setProperty('--on-sec', onColor(ec));
    el.innerHTML = `
      <div class="lg-block">
        <input class="lg-bars" type="number" inputmode="decimal" step="0.25" min="0.25" value="${fmtBars(sec.bars)}" aria-label="Bars" title="Bars in this section — decimals allowed (4.25)" onchange="updateBars(${i},this.value)">
        <span class="lg-unit">${sec.bars == 1 ? 'Bar' : 'Bars'}</span>
        <span class="lg-ts${custom ? ' custom' : ''}" title="${custom ? 'This section has its own time signature' : 'Follows the song'}"><input type="number" inputmode="numeric" min="1" max="15" value="${ets.n}" style="width:${String(ets.n).length}ch" aria-label="Beats per bar" onchange="updateSecTS(${i},'n',this.value)"><span class="lg-slash">/</span><select aria-label="Note value" onchange="updateSecTS(${i},'d',this.value)"><option value="4"${ets.d==4?' selected':''}>4</option><option value="8"${ets.d==8?' selected':''}>8</option></select></span>
      </div>
      <div class="lg-body">
        <div class="lg-head">
          <span class="lg-name"${hasAudio ? ` data-seek="1" onclick="seekEditorToSection(${i})" title="Jump the track to this section"` : ''}>${mod ? `<span class="lg-mod">${mod}</span>` : ''}${t.label}</span>
          ${num}
          ${sec.repeats > 1 ? `<span class="lg-rep">×${sec.repeats}</span>` : ''}
          <div class="lg-chips">
            <button type="button" class="chip${sec.mod==='pre' ? ' on' : ''}" onclick="setMod(${i},'pre')" aria-pressed="${sec.mod==='pre'}">Pre</button>
            <button type="button" class="chip${sec.mod==='post' ? ' on' : ''}" onclick="setMod(${i},'post')" aria-pressed="${sec.mod==='post'}">Post</button>
            <button type="button" class="chip${sec.repeats > 1 ? ' on' : ''}" onmousedown="if(event.shiftKey)event.preventDefault()" onclick="cycleRepeats(${i}, event.shiftKey ? -1 : 1)" title="How many times this section plays — Shift-click to count down">×${sec.repeats}</button>
            ${cue}

      </div>
      <div class="lg-rail">
        <button type="button" class="circ lg-dup" onclick="duplicateSection(${i})" title="Duplicate" aria-label="Duplicate section">${ico('dup')}</button>

    // typing in a field must never start a section drag

      inp.addEventListener('blur',        () => { el.draggable = canDrag; });

      el.addEventListener('dragstart', e => { dragSrc = i; el.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; });
      el.addEventListener('dragend',   () => { el.classList.remove('dragging'); document.querySelectorAll('#chart-list .section-block').forEach(b=>b.classList.remove('drag-over-top','drag-over-bot')); });
      el.addEventListener('dragover',  e => {
        e.preventDefault();
        const before = (e.clientY - el.getBoundingClientRect().top) < el.offsetHeight/2;

}

// Zoom the lane, holding one spot still: pos16 is the 16th under the pointer, offset how far

function applyFillZoom(z, pos16, offset){

  for(let s = Math.floor((total - len) / unit) * unit; s >= 0; s -= unit){ if(!hits(s)){ start = s; break; } }

// escape values placed into HTML attributes / text
function esc(str){ return String(str==null?'':str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtTime(s){ s=Math.max(0,Math.round(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
// like fmtTime but keeps hundredths-of-a-second — cue points are stored as floats, so show that precision
function fmtCue(s){ const cs=Math.round(Math.max(0,s)*100); return Math.floor(cs/6000)+':'+String(Math.floor(cs/100)%60).padStart(2,'0')+'.'+String(cs%100).padStart(2,'0'); }   // round to hundredths first: 62.37 is stored as 62.3699…, and flooring showed .36

// ─── AUDIO / TRACK ───────────────────────────────────
function parseYouTubeId(url){
  if(!url) return null;
  url = url.trim();
  // bare 11-char id
  if(/^[\w-]{11}$/.test(url)) return url;
  const m = url.match(/(?:youtu\.be\/|v=|\/embed\/|\/shorts\/)([\w-]{11})/);
  return m ? m[1] : null;
}

window.attachYouTube = function(url){
  const song = currentSong(); if(!song) return;
  const id = parseYouTubeId(url);
  if(!id){ showToast('Not a valid YouTube link','error'); document.getElementById('audio-url-input').value=''; return; }
  song.audio = { type:'youtube', videoId:id };
  window.save(); renderAudioBar(); window.renderChart();
  showToast('Track linked');
}

window.attachAudioFile = function(e){
  const file = e.target.files[0]; if(!file) return;
  const song = currentSong(); if(!song) return;
  if(localAudioURL) URL.revokeObjectURL(localAudioURL);
  localAudioURL = URL.createObjectURL(file);
  song.audio = { type:'file', name:file.name };   // name persists; blob is session-only
  window.save(); renderAudioBar(); window.renderChart();
  showToast('Audio loaded');
}

window.removeAudio = function(){
  const song = currentSong(); if(!song) return;
  song.audio = null;
  if(localAudioURL){ URL.revokeObjectURL(localAudioURL); localAudioURL = null; }
  window.save(); renderAudioBar(); window.renderChart();
}

function renderAudioBar(){
  const song = currentSong(); if(!song) return;
  const bar  = document.getElementById('audio-bar');
  if(song.audio){
    bar.classList.remove('empty');
    setupEditorAudio();
    renderSyncPanel();
  } else {
    bar.classList.add('empty');
    document.getElementById('audio-url-input').value = '';
    teardownEditorAudio();
  }

}

// Build the editor's inline player (YouTube IFrame API so we can read currentTime for cue tapping)
function setupEditorAudio(){
  const song = currentSong();
  const holder = document.getElementById('audio-bar-player');
  const key = song.audio.type === 'youtube' ? 'yt:'+song.audio.videoId : (localAudioURL ? 'file' : 'none');
  if(key === edLoadedKey) return;     // already loaded — don't rebuild (would interrupt playback)
  teardownEditorAudio();
  edLoadedKey = key; edCueIdx = 0;
  if(song.audio.type === 'youtube'){
    const mount = document.createElement('div'); holder.appendChild(mount);
    ensureYouTubeAPI(() => {
      edYtPlayer = new YT.Player(mount, {
        width:'216', height:'122', videoId: song.audio.videoId,
        playerVars:{ controls:1, rel:0, modestbranding:1 },
        events:{ onReady:()=>{ edYtReady = true; startEdClock(); startEdPlayhead(); }, onStateChange:()=>updateEdPlayBtn() }
      });
    });
  } else if(song.audio.type === 'file' && localAudioURL){
    holder.innerHTML = `<audio id="ed-audio-el" controls src="${localAudioURL}"></audio>`;
    edAudioEl = document.getElementById('ed-audio-el');
    edAudioEl.addEventListener('play', updateEdPlayBtn);
    edAudioEl.addEventListener('pause', updateEdPlayBtn);
    startEdClock(); startEdPlayhead();
  } else {
    holder.innerHTML = `<div class="ed-noplay">Re-load the audio file to play it</div>`;
  }
}
function teardownEditorAudio(){
  cancelAnimationFrame(edTimeRAF); cancelAnimationFrame(edPlayheadRAF);
  document.querySelectorAll('.ftl-playhead').forEach(p=>p.style.display='none');
  document.querySelectorAll('.section-block.playing').forEach(b=>b.classList.remove('playing'));
  if(edYtPlayer){ try{ edYtPlayer.destroy(); }catch(e){} edYtPlayer = null; edYtReady = false; }
  edAudioEl = null; edLoadedKey = '';

// called when entering performance so the editor player doesn't play over the perf player
function stopEditorPlayer(){ teardownEditorAudio(); }

// ── editor audio controls ──
function edAvailable(){ const s=currentSong(); return !!(s&&s.audio&&(s.audio.type==='youtube'||(s.audio.type==='file'&&localAudioURL))); }
function edGetTime(){ if(edYtPlayer&&edYtReady&&edYtPlayer.getCurrentTime) return edYtPlayer.getCurrentTime(); if(edAudioEl) return edAudioEl.currentTime||0; return 0; }
function edGetDur(){ if(edYtPlayer&&edYtReady&&edYtPlayer.getDuration) return edYtPlayer.getDuration()||0; if(edAudioEl) return edAudioEl.duration||0; return 0; }
function edPlaying(){ if(edYtPlayer&&edYtReady&&edYtPlayer.getPlayerState) return edYtPlayer.getPlayerState()===1; if(edAudioEl) return !edAudioEl.paused; return false; }
window.edPlayPause = function(){
  if(edYtPlayer&&edYtReady){ edPlaying()?edYtPlayer.pauseVideo():edYtPlayer.playVideo(); }
  else if(edAudioEl){ edPlaying()?edAudioEl.pause():edAudioEl.play(); }
  setTimeout(updateEdPlayBtn, 120);
}
function updateEdPlayBtn(){
  const p = String(edPlaying());
  document.querySelectorAll('.sync-play, .fm-play').forEach(b => {
    if(b.dataset.p === p) return;              // runs every frame — only touch the DOM when the state flips
    b.dataset.p = p; b.innerHTML = ico(p === 'true' ? 'pause' : 'play');
  });
}
function edSeek(t){
  if(edYtPlayer&&edYtReady){ edYtPlayer.seekTo(t, true); edYtPlayer.playVideo(); }
  else if(edAudioEl){ edAudioEl.currentTime = t; edAudioEl.play(); }
  setTimeout(updateEdPlayBtn, 200);
}
// , / . nudge a cue. The card updates in place and the save waits for a pause, so holding
// the key is smooth, one burst is one undo step, and the library isn't re-synced per press.
let cueNudgeTimer = null;
function nudgeCue(i, dt){
  const song = currentSong(), sec = song && song.sections[i];
  if(!sec) return;
  if(sec.time == null){ showToast(sectionDisplay(song, i) + ' has no cue yet — tap one with T', 'error'); return; }
  sec.time = Math.max(0, Math.round((sec.time + dt) * 100) / 100);
  const inp = document.querySelector(`#chart-list .section-block[data-idx="${i}"] .lg-cue input`);
  if(inp) inp.value = fmtCue(sec.time);
  showToast(sectionDisplay(song, i) + ' cue ' + fmtCue(sec.time));
  clearTimeout(cueNudgeTimer);
  cueNudgeTimer = setTimeout(() => window.save(), 450);
}
// move the track by dt seconds without changing whether it's playing (arrow keys)
let edNudgeTarget = null, edNudgeAt = 0;
function edNudge(dt){
  const dur = edGetDur(), now = performance.now();
  // YouTube keeps reporting the old position for a moment after a seek, so quick
  // presses build on the last target instead of all restarting from the same spot
  const recent = edNudgeTarget != null && now - edNudgeAt < 900;
  const from = recent ? edNudgeTarget + (edPlaying() ? (now - edNudgeAt) / 1000 : 0) : edGetTime();
  const t = Math.max(0, Math.min(dur || Infinity, from + dt));
  edNudgeTarget = t; edNudgeAt = now;
  if(edYtPlayer && edYtReady) edYtPlayer.seekTo(t, true);
  else if(edAudioEl) edAudioEl.currentTime = t;
  return t;
}
// Clicking the YouTube player puts keyboard focus inside its iframe, where the page can't hear
// keys. Hand focus straight back so T and the arrow keys keep working; the click still lands.
window.addEventListener('blur', () => {
  setTimeout(() => {
    const a = document.activeElement;
    if(!a || a.tagName !== 'IFRAME' || !a.closest('#audio-bar-player, #tp-video')) return;
    a.blur();
    if(document.activeElement === a) document.body.focus({ preventScroll:true });
  }, 0);
});
// where a section starts in the track: its own cue, or estimated from the nearest earlier cue + bar lengths
function sectionTrackTime(song, i){
  if(song.sections[i].time != null) return song.sections[i].time;
  for(let j=i-1; j>=0; j--){
    if(song.sections[j].time != null){
      let t = song.sections[j].time;
      for(let k=j; k<i; k++){ const s=song.sections[k]; t += (barMsFor(song,s) * s.bars * s.repeats) / 1000; }
      return t;
    }
  }
  return null;
}
// click a section → jump the editor's track to that part of the song
window.seekEditorToSection = (i) => {
  if(!edAvailable()){ return; }
  const song = currentSong();

  edSeek(t);

}
function startEdClock(){
  cancelAnimationFrame(edTimeRAF);
  const tick = () => {
    const t = document.querySelector('.sync-time');
    if(t) t.textContent = fmtTime(edGetTime()) + ' / ' + fmtTime(edGetDur());

// editor playhead: a moving line on the currently-playing section's timeline
function startEdPlayhead(){
  cancelAnimationFrame(edPlayheadRAF);
  const tick = () => { updateEdPlayhead(); edPlayheadRAF = requestAnimationFrame(tick); };
  tick();
}
function updateEdPlayhead(){
  document.querySelectorAll('.ftl-playhead').forEach(p => p.style.display='none');
  document.querySelectorAll('.section-block.playing').forEach(b => b.classList.remove('playing'));
  const song = currentSong();
  if(!song || !edAvailable()) return;          // shown while paused too, so a click in the fills lane is visible
  const t = edGetTime();
  const cued = song.sections.map((s,i)=>({s,i})).filter(o=>o.s.time!=null).sort((a,b)=>a.s.time-b.s.time);
  if(!cued.length) return;
  let cur = null;
  for(const o of cued){ if(t >= o.s.time - 0.05) cur = o; else break; }
  if(!cur) return;
  const block = document.querySelectorAll('#chart-list .section-block')[cur.i];
  if(block && edPlaying()) block.classList.add('playing');
  if(fillsIdx !== cur.i) return;                       // the lane only exists inside the open fills editor
  const tl = document.querySelector('#fills-box .fill-timeline'), ph = tl && tl.querySelector('.ftl-playhead');
  if(!tl || !ph) return;
  const ets = effTS(song, cur.s);
  const total16 = Math.round(cur.s.bars * sixteenthsPerBar(ets));
  let pos16;
  if(playheadMode() === 'cue'){
    // Stretch the crossing so it lands exactly on the next cue. Recordings drift off the
    // click, so pacing by BPM would run ahead or lag; the cues are the real anchors.
    const nxt = cued.find(o => o.s.time > cur.s.time);
    const bpmEnd = cur.s.time + (barMsFor(song, cur.s) * cur.s.bars * cur.s.repeats) / 1000;
    const endT = nxt ? nxt.s.time : bpmEnd;          // no next cue -> fall back to tempo
    const span = Math.max(0.05, endT - cur.s.time);
    pos16 = Math.max(0, Math.min(total16, ((t - cur.s.time) / span) * total16));
  } else {
    pos16 = Math.max(0, Math.min(total16, (t - cur.s.time) * 1000 / msPer16(song)));
  }
  const PX = +tl.dataset.px;
  ph.style.left = (pos16 * PX) + 'px';
  ph.style.display = 'block';
  const wrap = tl.closest('.fm-wrap');
  // The lane follows the playhead frame by frame, holding it about 45% in, so the music scrolls
  // past a steady line instead of the view jumping a half-screen whenever it reaches the edge.
  // Only while playing — scrolling a paused lane would slide it out from under the cursor.
  if(wrap && edPlaying()){
    const x = pos16 * PX, cw = wrap.clientWidth, max = Math.max(0, tl.offsetWidth - cw);
    const want = Math.max(0, Math.min(max, x - cw * 0.45));
    if(Math.abs(want - wrap.scrollLeft) > 0.5) wrap.scrollLeft = want;
  }
}

// ─── PERFORMANCE — TELEPROMPTER ──────────────────────
// Performing follows the track, so it needs one — plus a cue on at least one section.
// Sections without a cue are placed from the nearest cue and their bar lengths.
function performBlocker(song){
  if(!song || !song.sections.length) return { long:'Perform', short:'Perform', why:'Add a section first', disabled:true };
  if(!song.audio) return { long:'Add a track to perform', short:'Add track', why:'Performing follows the track', act:'track' };
  if(!audioAvailable()) return { long:'Re-load audio to perform', short:'Re-load audio', why:'Audio files need re-loading after a refresh', act:'file' };
  if(!songCueCount(song)) return { long:'Tap a cue to perform', short:'Tap a cue', why:'Press T on the first downbeat', act:'cue' };
  return null;
}
function updatePerformBtn(){
  const btn = document.getElementById('perform-btn'); if(!btn) return;
  const b = performBlocker(currentSong());
  btn.classList.toggle('go', !b);
  btn.classList.toggle('blocked', !!b);
  btn.disabled = !!(b && b.disabled);
  btn.title = b ? b.why : 'Perform — follows the track';
  const icon = !b || b.disabled ? 'play' : b.act === 'cue' ? 'tap' : b.act === 'file' ? 'upload' : 'music';
  const label = b ? `<span class="lbl-long">${b.long}</span><span class="lbl-short">${b.short}</span>` : 'Perform';
  const html = ico(icon) + label + (b && b.act === 'cue' ? '<kbd class="tap-key">T</kbd>' : '');
  if(btn.innerHTML !== html) btn.innerHTML = html;
}

// Where every section starts and how its bars are clocked. In "cue points" mode a section's
// bars stretch to land exactly on the next section's start; in "tempo" mode they run at BPM.
function buildPerfTimeline(song){
  const n = song.sections.length;
  const dur = song.sections.map(s => barMsFor(song, s) * s.bars * s.repeats / 1000);
  const start = song.sections.map(s => s.time != null ? s.time : null);
  for(let i = 1; i < n; i++) if(start[i] == null && start[i-1] != null) start[i] = start[i-1] + dur[i-1];
  for(let i = n - 2; i >= 0; i--) if(start[i] == null && start[i+1] != null) start[i] = Math.max(0, start[i+1] - dur[i]);
  const bpm = playheadMode() === 'bpm';
  const secs = song.sections.map((sec, i) => {
    const ets = effTS(song, sec);
    const layout = secLayout(song, sec);
    const pass16 = layout.reduce((a, b) => a + b.len16, 0);
    const total16 = pass16 * sec.repeats;
    const end = i < n - 1 ? start[i+1] : start[i] + dur[i];
    const span = bpm ? dur[i] : Math.max(0.05, end - start[i]);
    return { i, sec, ets, layout, pass16, total16, start:start[i], per16:span / total16,
             beat16:sixteenthsPerBeat(ets), counted:countedBars(layout), bars:countedBars(layout) * sec.repeats };
  });
  const events = [];
  secs.forEach(x => {
    if(x.i > 0 || x.start > 0.5) events.push({ t:x.start, type:'section', si:x.i });
    for(let r = 0; r < x.sec.repeats; r++)
      (x.sec.fills || []).forEach((f, fi) => events.push({ t:x.start + (r * x.pass16 + f.start16) * x.per16, len:f.len16 * x.per16, type:'fill', si:x.i, fi }));
  });
  events.sort((a, b) => a.t - b.t);
  return { secs, events };
}
function perfPosition(tl, t){
  let ci = -1;
  for(const x of tl.secs) if(t >= x.start - 0.15) ci = x.i;          // a tapped cue lands a touch late
  if(ci < 0) return { ci:-1 };
  const x = tl.secs[ci];
  const pos16 = Math.max(0, Math.min(x.total16 - 1e-6, (t - x.start) / x.per16));
  const rep = Math.floor(pos16 / x.pass16), within16 = pos16 - rep * x.pass16;
  let k = x.layout.length - 1;
  for(let j = 0; j < x.layout.length; j++) if(within16 < x.layout[j].start16 + x.layout[j].len16 - 1e-9){ k = j; break; }
  const b = x.layout[k];
  const beatsInBar = Math.max(1, Math.round(b.len16 / x.beat16));
  return { ci, bar:b.num == null ? 0 : rep * x.counted + b.num, bars:x.bars, beatsInBar, within16,
           beat:Math.min(beatsInBar, Math.floor((within16 - b.start16) / x.beat16) + 1), prog:pos16 / x.total16 };
}

function renderPerfRows(song){
  document.getElementById('tp-rows').innerHTML = '<div class="tp-list">' + song.sections.map((sec, i) => {
    const ec = effColor(sec), ets = effTS(song, sec), lay = secLayout(song, sec);
    const fills = (sec.fills || []).map((f, fi) => ({ f, fi, bb:fillBarBeat(ets, f.start16, lay) })).sort((a, b) => a.f.start16 - b.f.start16);
    const name = esc(sectionDisplay(song, i));
    return `<div class="tp-row" data-i="${i}" role="button" title="Jump here" aria-label="Jump to ${name}" style="--sec:${ec};--on-sec:${onColor(ec)}" onclick="perfSeekSection(${i})">
      <div class="tp-blk"><b class="tp-num">${fmtBars(sec.bars)}</b><span class="tp-unit">${sec.bars == 1 ? 'Bar' : 'Bars'}</span><span class="tp-beats"></span></div>
      <div class="tp-body">
        <div class="tp-name">${name}${sec.repeats > 1 ? `<span class="tp-rep">×${sec.repeats}</span>` : ''}</div>
        <div class="tp-meta"><span class="tp-when"></span><span class="tp-mn">${esc(sec.notes || '')}</span></div>
        <div class="tp-notes">${esc(sec.notes || '')}</div>
        <div class="tp-fills">${fills.map(o => `<button type="button" class="tp-fill" data-fi="${o.fi}" title="Jump to this fill" onclick="perfSeekFill(${i},${o.fi},event)"><span class="tp-cnt"></span>Fill · ${barBeatLabel(o.bb, true)}${o.f.notes ? ' — ' + esc(o.f.notes) : ''}</button>`).join('')}</div>
      </div>
      <div class="tp-prog"><i></i></div>
    </div>`;
  }).join('') + '</div>';
}
// a row shows its bar count at rest; while playing or counting in it borrows the number
function perfRestRow(row, sec){
  if(!row.dataset.live) return;
  row.querySelector('.tp-num').textContent = fmtBars(sec.bars);
  row.querySelector('.tp-unit').textContent = sec.bars == 1 ? 'Bar' : 'Bars';
  delete row.dataset.live;
}
function perfSetCurrent(rows, ci){
  const secs = currentSong().sections;
  rows.forEach((r, i) => {
    r.classList.toggle('done', ci >= 0 && i < ci);
    r.classList.toggle('now', i === ci);
    r.classList.remove('incoming');
    if(i === ci) r.dataset.live = '1'; else perfRestRow(r, secs[i]);
  });
}
// hold the playing row about a fifth of the way down, unless someone is scrolling by hand
function perfScrollTo(rows, ci, instant){
  if(performance.now() < perfManualScrollUntil) return;
  const box = document.getElementById('tp-rows');
  requestAnimationFrame(() => {
    const top = ci < 0 ? 0 : rows[ci].getBoundingClientRect().top - box.getBoundingClientRect().top + box.scrollTop - box.clientHeight * 0.18;
    box.scrollTo({ top:Math.max(0, top), behavior:instant ? 'auto' : 'smooth' });
  });
}
function perfUpdateWhen(rows, tl, p){
  let acc = p.bars - Math.max(1, p.bar) + 1;
  rows.forEach((r, k) => {
    const w = r.querySelector('.tp-when');
    if(k <= p.ci){ w.textContent = ''; return; }
    w.textContent = 'in ' + acc + ' bar' + (acc === 1 ? '' : 's');
    acc += tl.secs[k].bars;
  });
}
function perfDrawMarks(tl, dur){
  document.getElementById('tp-seek-marks').innerHTML = tl.secs.map(x =>
    `<i class="tp-mark" style="left:${Math.min(100, x.start / dur * 100)}%;--sec:${effColor(x.sec)}"></i>`).join('');
}

function perfFollow(){
  cancelAnimationFrame(perfRAF);
  const song = currentSong(), tl = perfTL;
  const rows = [...document.querySelectorAll('#tp-rows .tp-row')];
  const st = { ci:-2, bar:0, beat:0, beatsInBar:0, incoming:-1, count:0, fillKey:'', playing:null, nowS:'', dur:0, held:false, whenS:'' };
  const overlay = document.getElementById('perf-overlay');
  const tick = () => {
    if(!overlay.classList.contains('active')){ perfRAF = null; return; }
    const t = getAudioTime(), dur = getAudioDuration();
    const p = perfPosition(tl, t);

    if(p.ci !== st.ci){
      perfSetCurrent(rows, p.ci);
      perfScrollTo(rows, p.ci, st.ci === -2);
      st.ci = p.ci; st.bar = 0; st.beat = 0; st.beatsInBar = 0; st.incoming = -1; st.count = 0;
    }
    const held = performance.now() < perfManualScrollUntil;
    if(perfRecenter){ perfRecenter = false; perfScrollTo(rows, st.ci, true); }
    if(st.held && !held) perfScrollTo(rows, st.ci);
    st.held = held;

    if(p.ci >= 0){
      const cur = rows[p.ci], x = tl.secs[p.ci];
      if(p.bar !== st.bar){
        st.bar = p.bar;
        cur.querySelector('.tp-num').textContent = p.bar;
        cur.querySelector('.tp-unit').textContent = 'of ' + p.bars;
        perfUpdateWhen(rows, tl, p);
        cur.querySelectorAll('.tp-fill').forEach(el => {
          const f = x.sec.fills[+el.dataset.fi];
          el.classList.toggle('past', f.start16 + f.len16 <= p.within16);
        });
      }
      if(p.beatsInBar !== st.beatsInBar){ st.beatsInBar = p.beatsInBar; st.beat = 0; cur.querySelector('.tp-beats').innerHTML = '<i></i>'.repeat(p.beatsInBar); }
      if(p.beat !== st.beat){ st.beat = p.beat; cur.querySelectorAll('.tp-beats i').forEach((d, k) => d.classList.toggle('on', k < p.beat)); }
      cur.querySelector('.tp-prog i').style.width = (p.prog * 100) + '%';
    } else if(rows[0]){
      const w = 'in ' + fmtTime(Math.max(0, tl.secs[0].start - t));
      if(w !== st.whenS){ st.whenS = w; rows[0].querySelector('.tp-when').textContent = w; }
    }

    // count-in to the next section or fill, and the fill sounding right now
    const mode = countInMode();
    const hit = tl.events.find(e => e.type === 'fill' && t >= e.t && t < e.t + Math.max(0.35, e.len));
    // one bar of count-in, in that bar's own beats and tempo. Sections and fills count independently —
    // a fill so often leads straight into the next section, and neither should hide the other
    const countTo = e => {
      if(!e) return 0;
      const own = tl.secs[e.si];
      const lead = e.type === 'section' && e.si > 0 ? tl.secs[e.si - 1] : own;   // a section's count-in is the bar before it
      const beats = lead === own ? own.ets.n : Math.max(1, Math.round(lead.layout[lead.layout.length - 1].len16 / lead.beat16));
      const beatSec = lead.per16 * lead.beat16, left = e.t - t;
      return left <= beats * beatSec ? Math.max(1, beats - Math.ceil(left / beatSec) + 1) : 0;
    };
    const nextSec = mode === 'off' ? null : tl.events.find(e => e.type === 'section' && e.si > p.ci && e.t > t + 1e-4);
    const nextFill = mode === 'all' ? tl.events.find(e => e.type === 'fill' && e.t > t + 1e-4) : null;
    const count = countTo(nextSec), fillCount = countTo(nextFill);
    const incoming = count ? nextSec.si : -1, soon = fillCount ? nextFill : null;
    if(incoming !== st.incoming){
      if(st.incoming >= 0){ rows[st.incoming].classList.remove('incoming'); perfRestRow(rows[st.incoming], song.sections[st.incoming]); }
      if(incoming >= 0){ rows[incoming].classList.add('incoming'); rows[incoming].dataset.live = '1'; }
      st.incoming = incoming; st.count = 0;
    }
    if(incoming >= 0 && count !== st.count){
      st.count = count;
      const r = rows[incoming];
      r.querySelector('.tp-num').textContent = count;
      r.querySelector('.tp-unit').textContent = 'Count';
      r.classList.remove('beat'); void r.offsetWidth; r.classList.add('beat');
    }
    const fillKey = (hit ? 'h' + hit.si + '.' + hit.fi : '') + '|' + (soon ? 's' + soon.si + '.' + soon.fi + '.' + fillCount : '');
    if(fillKey !== st.fillKey){
      st.fillKey = fillKey;
      document.querySelectorAll('#tp-rows .tp-fill.soon, #tp-rows .tp-fill.hit').forEach(el => { el.classList.remove('soon', 'hit'); el.querySelector('.tp-cnt').textContent = ''; });
      const mark = (e, cls, txt) => { const el = rows[e.si] && rows[e.si].querySelector(`.tp-fill[data-fi="${e.fi}"]`); if(el){ el.classList.add(cls); el.querySelector('.tp-cnt').textContent = txt; } };
      if(soon) mark(soon, 'soon', fillCount + ' ·');
      if(hit) mark(hit, 'hit', 'Now ·');
    }

    const playing = isAudioPlaying();
    if(playing !== st.playing){ st.playing = playing; document.getElementById('tp-play').innerHTML = ico(playing ? 'pause' : 'play'); }
    const nowS = fmtTime(t);
    if(nowS !== st.nowS){ st.nowS = nowS; document.getElementById('tp-now').textContent = nowS; }
    if(dur && Math.round(dur) !== st.dur){ st.dur = Math.round(dur); document.getElementById('tp-dur').textContent = fmtTime(dur); perfDrawMarks(tl, dur); }
    if(dur && !perfSeeking) document.getElementById('tp-seek-fill').style.width = Math.min(100, t / dur * 100) + '%';
    perfRAF = requestAnimationFrame(tick);
  };
  tick();
}

// ── transport ──
window.perfSeekSection = function(i){
  const x = perfTL && perfTL.secs[i]; if(!x) return;
  perfManualScrollUntil = 0;
  seekAudioTo(x.start);
};
window.perfSeekFill = function(si, fi, ev){
  if(ev) ev.stopPropagation();                     // the row itself jumps to the section
  if(!perfTL) return;
  const hits = perfTL.events.filter(e => e.type === 'fill' && e.si === si && e.fi === fi);
  if(!hits.length) return;
  const t = getAudioTime();
  const e = hits.find(h => h.t > t + 0.25) || hits[hits.length - 1];
  perfManualScrollUntil = 0;
  seekAudioTo(Math.max(0, e.t));
};
// ↑ early in a section goes to the one before; later, back to this one's top
function perfStep(dir){
  if(!perfTL) return;
  const t = getAudioTime(), p = perfPosition(perfTL, t);
  let i = p.ci < 0 ? 0 : p.ci + dir;
  if(dir < 0 && p.ci >= 0 && t - perfTL.secs[p.ci].start > 1.5) i = p.ci;
  window.perfSeekSection(Math.max(0, Math.min(perfTL.secs.length - 1, i)));
}
// quick presses build on the last target — the player reports the old position for a moment after a seek
function perfNudge(dt){
  const dur = getAudioDuration(), now = performance.now();
  const recent = perfNudgeTarget != null && now - perfNudgeAt < 900;
  const from = recent ? perfNudgeTarget + (isAudioPlaying() ? (now - perfNudgeAt) / 1000 : 0) : getAudioTime();
  const t = Math.max(0, Math.min(dur || Infinity, from + dt));

}

// ── full screen ──
// The whole document goes full screen, not just the overlay, so menus and toasts still draw.
function fullscreenOn(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
window.toggleFullscreen = function(){
  try{
    if(fullscreenOn()){
      const exit = document.exitFullscreen || document.webkitExitFullscreen;
      if(exit) exit.call(document);
      return;
    }
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if(!req){ showToast('This browser has no full screen — on iPhone use Share \u2192 Add to Home Screen', 'error'); return; }
    const r = req.call(el, { navigationUI:'hide' });
    if(r && r.catch) r.catch(() => showToast('Full screen was blocked', 'error'));
  }catch(_){ showToast('Full screen was blocked', 'error'); }
};

// ── keep the screen awake while performing ──
async function requestWakeLock(){
  try{ if('wakeLock' in navigator) perfWakeLock = await navigator.wakeLock.request('screen'); }catch(_){ perfWakeLock = null; }
}
function releaseWakeLock(){ try{ if(perfWakeLock) perfWakeLock.release(); }catch(_){} perfWakeLock = null; }
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible' && document.getElementById('perf-overlay').classList.contains('active')) requestWakeLock();
});

// Build the player inside the performance view
function setupPerfAudio(song){

    holder.classList.remove('audio-only');

window.startPerf = function(){
  const song = currentSong();
  const b = performBlocker(song);
  if(b){
    if(sharedSong || b.disabled){ showToast(sharedSong ? (song && song.audio ? 'This chart has no cues to follow' : 'This chart has no track to follow') : b.why, 'error'); return; }
    if(b.act === 'track'){
      const u = document.getElementById('audio-url-input');
      u.scrollIntoView({ block:'nearest' }); u.focus();

    } else if(b.act === 'cue'){

    }
    return;
  }
  window.saveSongMeta();
  hideCtx();
  stopEditorPlayer();                     // the editor's inline player mustn't play over this one
  perfTL = buildPerfTimeline(song);
  perfManualScrollUntil = 0; perfSeeking = false; perfNudgeTarget = null;

  renderPerfRows(song);

window.stopPerf = function(){
  cancelAnimationFrame(perfRAF); perfRAF = null;
  pauseAudio();
  if(ytPlayer){ try{ ytPlayer.destroy(); }catch(e){} ytPlayer = null; ytReady = false; }
  if(htmlAudio){ htmlAudio.pause(); htmlAudio = null; }
  document.getElementById('tp-video').innerHTML = '';

window.updateBars = (i,v) => {
  const song = currentSong(); const sec = song.sections[i];
  // bars can be fractional (e.g. 4.25) — snap to the nearest 16th of a bar, min a quarter bar
  const raw = parseFloat(v);
  sec.bars = isNaN(raw) ? 1 : Math.max(0.25, Math.round(raw*16)/16);
  // drop fills that now start past the end of the section (fills are 16th-based: start16/len16)
  const total16 = Math.round(sec.bars * sixteenthsPerBar(effTS(song, sec)));
  sec.fills = (sec.fills||[]).filter(f => f.start16 < total16);
  sec.fills.forEach(f => { f.len16 = Math.max(1, Math.min(f.len16, total16 - f.start16)); });
  window.save(); window.renderChart();
}
window.updateNotes = (i,v) => { currentSong().sections[i].notes = v; window.save(); }
// Turn a section into another type in place — bars, time signature, notes, fills, repeats and

};

// reorder fill cards: keep the timeline slots, move the notes/ideas to match the new order
window.reorderFills = (i, from, to) => {
  if(from === to || from == null) return;
  const sec = currentSong().sections[i];
  const order = sec.fills.map((f,k)=>k).sort((a,b)=> sec.fills[a].start16 - sec.fills[b].start16); // visual order
  const slots = order.map(k => ({ start16: sec.fills[k].start16, len16: sec.fills[k].len16 }));
  const moved = order.splice(from, 1)[0];
  order.splice(to, 0, moved);
  // reassign the (sorted) slots to the new note order
  order.forEach((fillIdx, pos) => { sec.fills[fillIdx].start16 = slots[pos].start16; sec.fills[fillIdx].len16 = slots[pos].len16; });
  window.save(); window.renderChart();

// ── drum fills: positioned at a bar, starting on a beat, lasting N beats ──
// click a bar in the grid to add/remove a fill there
window.removeFill = (i, fi) => { currentSong().sections[i].fills.splice(fi, 1); window.save(); window.renderChart(); }
window.duplicateFill = (i, fi) => {
  const sec = currentSong().sections[i]; const f = sec.fills[fi];
  const total = Math.round(sec.bars * sixteenthsPerBar(effTS(currentSong(), sec)));
  const start = Math.min(total - 1, f.start16 + f.len16);
  sec.fills.push({ start16: start, len16: Math.min(f.len16, total - start), notes: f.notes });
  window.save(); window.renderChart();

// A click in the fills lane moves the track to that spot, on the same clock the lane's playhead follows:
// cued sections stretch to the next cue in "cue points" mode, everything else runs at BPM from its start.
function fillLaneSeek(i, pos16){
  const song = currentSong(), sec = song && song.sections[i];
  if(!sec) return;
  if(!edAvailable()){ showToast(song.audio ? 'Re-load the audio file first' : 'Add a track to move through it', 'error'); return; }
  const total16 = Math.max(1, Math.round(sec.bars * sixteenthsPerBar(effTS(song, sec))));
  let t;
  if(sec.time != null && playheadMode() === 'cue'){
    const next = song.sections.filter(s => s.time != null && s.time > sec.time).sort((a, b) => a.time - b.time)[0];
    const end = next ? next.time : sec.time + barMsFor(song, sec) * sec.bars * sec.repeats / 1000;
    t = sec.time + (pos16 / total16) * (end - sec.time);
  } else {
    const start = sectionTrackTime(song, i);
    if(start == null){ showToast('Tap a cue first — T on the first downbeat', 'error'); return; }
    t = start + pos16 * msPer16(song) / 1000;
  }
  edNudgeTarget = null;                     // a fresh position, not part of an arrow-key run
  const wasPlaying = edPlaying();
  if(edYtPlayer && edYtReady){
    edYtPlayer.seekTo(Math.max(0, t), true);
    if(!wasPlaying) edYtPlayer.pauseVideo();  // YouTube starts an unplayed video on a seek — a click should only move the playhead
  }
  else if(edAudioEl) edAudioEl.currentTime = Math.max(0, t);
}
// drag-to-draw fill timeline (pointer events → mouse + touch); snaps to 16th notes
function attachFillTimeline(tl, blockEl){
  const i = +tl.dataset.i, PX = +tl.dataset.px, total = +tl.dataset.total;
  const unit = Math.max(1, +tl.dataset.unit || 1);     // snap grid, in 16ths
  const setDrag = on => { if(blockEl) blockEl.draggable = on; };
  const raw = clientX => {
    const rect = tl.getBoundingClientRect();
    return Math.max(0, Math.min(total, (clientX - rect.left) / PX));
  };
  const snap = clientX => Math.max(0, Math.min(total, Math.round(raw(clientX) / unit) * unit));
  // ── drag the odd bar to a different slot in the section ──
  const handle = tl.querySelector('[data-odd-handle]');
  if(handle){
    handle.addEventListener('pointerdown', e => {
      if(e.button) return;
      e.stopPropagation();                      // never start a fill drag from the handle
      setDrag(false);
      const song = currentSong(), sec = song.sections[i];
      const ets = effTS(song, sec);
      const slots = secLayout(song, sec).length;
      const rect = tl.getBoundingClientRect();
      const spbPX = sixteenthsPerBar(ets) * PX;
      try { handle.setPointerCapture(e.pointerId); } catch(_){}
      handle.classList.add('dragging');
      let target = sec.oddAt == null ? slots - 1 : sec.oddAt;
      const move = ev => {
        // which bar slot is the pointer over?
        const k = Math.max(0, Math.min(slots - 1, Math.floor((ev.clientX - rect.left) / spbPX)));
        if(k !== target){
          target = k;
          tl.querySelectorAll('.ftl-measure').forEach(m =>
            m.classList.toggle('ftl-odd-target', +m.dataset.bar === k));
        }
      };
      const up = () => {
        handle.removeEventListener('pointermove', move);
        handle.removeEventListener('pointerup', up);
        handle.classList.remove('dragging');
        setDrag(true);
        const wasLast = slots - 1;
        sec.oddAt = (target === wasLast) ? null : target;   // null keeps "last bar" behaviour
        window.save(); window.renderChart();
      };
      handle.addEventListener('pointermove', move);
      handle.addEventListener('pointerup', up);
    });
  }
  tl.addEventListener('pointerdown', e => {
    if(e.button) return;
    if(e.target.hasAttribute('data-odd-handle')) return;   // handled above
    setDrag(false);
    const sec = currentSong().sections[i];
    const fillEl = e.target.closest('.ftl-fill');
    const isResize = e.target.classList.contains('ftl-fill-resize');
    const down16 = snap(e.clientX), downRaw = raw(e.clientX), slop = e.pointerType === 'touch' ? 6 : 2;
    let moved = false, ghost, mode, fi, origStart, origLen;
    if(fillEl && !fillEl.classList.contains('ftl-ghost')){
      fi = +fillEl.dataset.fi; mode = isResize ? 'resize' : 'move';
      origStart = sec.fills[fi].start16; origLen = sec.fills[fi].len16; ghost = fillEl;
    } else {
      mode = 'create';
      ghost = document.createElement('div'); ghost.className = 'ftl-fill ftl-ghost';
      const a0 = Math.max(0, Math.min(down16, total - unit));
      ghost.style.left = a0*PX+'px'; ghost.style.width = unit*PX+'px';
      ghost.dataset.a = a0; ghost.dataset.b = a0 + unit; tl.appendChild(ghost);
    }
    try{ tl.setPointerCapture(e.pointerId); }catch(_){}
    const onMove = ev => {
      const cur16 = snap(ev.clientX);
      if(Math.abs(ev.clientX - e.clientX) > slop) moved = true;
      if(mode === 'create'){
        const a = Math.min(down16, cur16, total - unit), b = Math.min(total, Math.max(a + unit, down16, cur16));
        ghost.style.left = a*PX+'px'; ghost.style.width = (b-a)*PX+'px';
        ghost.dataset.a = a; ghost.dataset.b = b;
      } else if(mode === 'move'){
        const ns = Math.max(0, Math.min(total - origLen, origStart + (cur16 - down16)));
        ghost.style.left = ns*PX+'px'; ghost.dataset.ns = ns;
      } else {
        const nl = Math.max(Math.min(unit, total - origStart), Math.min(total - origStart, cur16 - origStart));
        ghost.style.width = nl*PX+'px'; ghost.dataset.nl = nl;
      }
    };
    const onUp = () => {
      tl.removeEventListener('pointermove', onMove);
      tl.removeEventListener('pointerup', onUp);
      tl.removeEventListener('pointercancel', onCancel);
      setDrag(true);
      const s2 = currentSong().sections[i];
      if(mode === 'create'){
        let a = +ghost.dataset.a, b = +ghost.dataset.b;
        ghost.remove();
        if(!moved){
          // Detected here rather than with dblclick: no redraw between the clicks, and a double-tap works on phones too
          const now = performance.now();
          const again = lastLaneTap && lastLaneTap.i === i && now - lastLaneTap.at < 380 && Math.abs(downRaw - lastLaneTap.pos) * PX < 14;   // compared in the lane, so a scroll between clicks can't misplace a fill
          if(!again){                                   // one click: move the playhead here
            lastLaneTap = { i, at:now, pos:downRaw };
            fillLaneSeek(i, downRaw);
            return;
          }
          lastLaneTap = null;                           // double click: a beat-long fill (a grid cell, if coarser) in that cell
          const len = Math.min(total, Math.max(unit, sixteenthsPerBeat(effTS(currentSong(), s2))));
          a = Math.max(0, Math.min(Math.floor(downRaw / unit) * unit, total - len)); b = a + len;
        }
        s2.fills.push({ start16: a, len16: Math.max(1, b - a), notes: '' });
      } else if(mode === 'move' && !moved){             // clicking a fill without dragging it: just move the playhead
        fillLaneSeek(i, downRaw);
        return;
      } else if(mode === 'move' && ghost.dataset.ns !== undefined){
        s2.fills[fi].start16 = +ghost.dataset.ns;
      } else if(mode === 'resize' && ghost.dataset.nl !== undefined){
        s2.fills[fi].len16 = +ghost.dataset.nl;
      }
      window.save(); window.renderChart();   // the fills editor keeps its own scroll position
    };
    const onCancel = () => {       // the OS took the gesture (scroll, notification…) — undo the half-made change
      tl.removeEventListener('pointermove', onMove);
      tl.removeEventListener('pointerup', onUp);
      tl.removeEventListener('pointercancel', onCancel);
      setDrag(true);
      window.renderChart();
    };
    tl.addEventListener('pointermove', onMove);
    tl.addEventListener('pointerup', onUp);
    tl.addEventListener('pointercancel', onCancel);
    e.preventDefault();
  });
}
// cue points
window.clearCue = (i) => { currentSong().sections[i].time = null; edCueIdx = Math.min(edCueIdx, i); window.save(); window.renderChart(); renderSyncPanel(); }
// parse a typed cue time: "2:39.42", "2:39", "159.42" or "159" → seconds (null if unusable)
function parseCue(str){
  const s = String(str).trim(); if(!s) return null;
  const m = s.match(/^(?:(\d+):)?(\d+(?:\.\d+)?)$/);
  if(!m) return null;
  const mins = m[1] ? parseInt(m[1]) : 0;
  const secs = parseFloat(m[2]);
  if(isNaN(secs)) return null;
  return Math.max(0, mins*60 + secs);
}
// type an exact cue time into a section's cue box
window.setCueText = (i, v) => {
  const sec = currentSong().sections[i];
  const t = parseCue(v);
  if(t == null){ showToast('Use M:SS.cc — e.g. 2:39.42', 'error'); window.renderChart(); return; }
  sec.time = t;
  edCueIdx = Math.max(edCueIdx, i + 1);
  window.save(); window.renderChart(); renderSyncPanel();
  showToast('Cue set to ' + fmtCue(t));
};
// toggle this section's cue: set it to the track's current play time, or clear it if already set
window.setCueHere = (i) => {
  const sec = currentSong().sections[i];
  if(sec.time != null){            // already cued → clear it
    sec.time = null;
    edCueIdx = Math.min(edCueIdx, i);   // rewind the TAP-CUE cursor so the next tap re-stamps THIS section
    window.save(); window.renderChart(); renderSyncPanel();
    showToast('Cue cleared');
    return;
  }
  if(!edAvailable()){ showToast('Add a track first', 'error'); return; }
  sec.time = edGetTime();
  edCueIdx = Math.max(edCueIdx, i + 1);   // keep the sequential TAP-CUE cursor past this one
  window.save(); window.renderChart(); renderSyncPanel();
  showToast(sectionDisplay(currentSong(), i) + ' cued at ' + fmtCue(sec.time));
}

// drag reorder
function reorderSection(from, to){
  if(from==null || from===to || to===from+1) { dragSrc=null; return; }
  const secs = currentSong().sections;
  const [moved] = secs.splice(from, 1);
  if(to > from) to--;             // account for the removed element
  secs.splice(to, 0, moved);
  dragSrc = null;
  window.save(); window.renderChart();
}
