document.addEventListener('keydown', e => {
  if(!document.getElementById('perf-overlay').classList.contains('active')) return;
  if(e.target instanceof Element && e.target.closest('input, textarea, select')) return;
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  if(e.key === 'ArrowLeft' || e.key === 'ArrowRight'){ e.preventDefault(); perfNudge((e.key === 'ArrowLeft' ? -1 : 1) * (e.shiftKey ? 1 : 5)); }
  else if(e.key === 'ArrowUp'){ e.preventDefault(); if(!e.repeat) perfStep(-1); }
  else if(e.key === 'ArrowDown'){ e.preventDefault(); if(!e.repeat) perfStep(1); }
  else if(e.key === 'f' || e.key === 'F'){ if(!e.repeat){ e.preventDefault(); window.toggleFullscreen(); } }
  else if(e.key === 'Escape'){ hideCtx(); if(fullscreenOn()) return; window.stopPerf(); }
});

// ─── RIGHT-CLICK CONTEXT MENU + SECTION SELECTION ───
function setSelectedSection(i){
  selectedSectionIdx = i;
  document.querySelectorAll('.section-block').forEach(b => b.classList.toggle('selected', +b.dataset.idx === i));
}
const ctxEl = document.getElementById('ctx-menu');
function hideCtx(){ ctxEl.style.display='none'; ctxEl.innerHTML=''; }
function showCtx(x, y, items, opts = {}){
  const flat = new Map();
  const renderList = list => list.map(it => {
    if(it === '---') return '<div class="ctx-sep" role="separator"></div>';
    if(it.heading) return `<div class="ctx-heading">${it.label}</div>`;
    flat.set(it.id, it);
    const lead = it.dot ? `<i class="ctx-dot" style="background:${it.dot}"></i>` : (it.icon ? ico(it.icon) : '');
    const tail = it.submenu ? `<span class="ctx-arrow">${ico('chev-r')}</span>`
                            : (it.key ? `<kbd class="ctx-key">${it.key}</kbd>` : '');
    return `<div class="ctx-item${it.disabled ? ' disabled' : ''}${it.danger ? ' ctx-danger' : ''}${it.submenu ? ' ctx-has-sub' : ''}" data-act="${it.id}" role="menuitem"${it.disabled ? ' aria-disabled="true"' : ''}>
              <span class="ctx-ico">${lead}</span><span class="ctx-label">${it.label}</span>${tail}
              ${it.submenu ? `<div class="ctx-sub" role="menu">${renderList(it.submenu)}</div>` : ''}
            </div>`;
  }).join('');
  ctxEl.innerHTML = renderList(items);
  const sheet = innerWidth <= 560;               // phones get a bottom sheet instead of a floating menu
  ctxEl.classList.toggle('sheet', sheet);
  ctxEl.style.display = 'block';
  if(sheet){
    ctxEl.style.left = ''; ctxEl.style.top = '';
  } else {
    const mw = ctxEl.offsetWidth, mh = ctxEl.offsetHeight;
    const left = opts.alignRight ? x - mw : x;
    ctxEl.style.left = Math.max(8, Math.min(left, innerWidth - mw - 8)) + 'px';
    ctxEl.style.top  = Math.max(8, Math.min(y, innerHeight - mh - 8)) + 'px';
    // flip submenus to the left when there isn't room on the right
    ctxEl.querySelectorAll('.ctx-has-sub').forEach(el => {
      if(parseFloat(ctxEl.style.left) + mw + 210 > innerWidth) el.classList.add('flip');
    });
  }
  ctxEl.querySelectorAll('.ctx-item:not(.disabled)').forEach(el => {
    el.onclick = ev => {
      ev.stopPropagation();                       // don't let a sub-item fire its parent too
      const act = flat.get(el.dataset.act);
      if(act && act.submenu){ el.classList.toggle('sub-open'); return; }   // touch has no hover: tap opens it
      hideCtx(); if(act && act.run) act.run();
    };
  });
}
// the section menu — shared by right-click and the ⋯ button on each card
function sectionMenuItems(i){
  const song = currentSong(), n = song.sections.length, sec = song.sections[i];
  return [
    {id:'undo', icon:'undo', label:'Undo', key:KEYS.undo, disabled:!undoStack.length, run:()=>window.undoEdit()},
    {id:'redo', icon:'redo', label:'Redo', key:KEYS.redo, disabled:!redoStack.length, run:()=>window.redoEdit()},
    '---',
    addSectionMenu(i + 1),
    setTypeMenu(i, sec),
    '---',
    {id:'dup', icon:'dup', label:'Duplicate', key:KEYS.dup, run:()=>window.duplicateSection(i)},
    {id:'copy', icon:'copy', label:'Copy', key:KEYS.copy, run:()=>window.copySection(i)},
    {id:'cut', icon:'cut', label:'Cut', key:KEYS.cut, run:()=>window.cutSection(i)},
    {id:'paste', icon:'paste', label:'Paste below', key:KEYS.paste, disabled:!sectionClipboard, run:()=>window.pasteSection(i)},
    '---',
    {id:'fills', icon:'fills', label:'Edit fills', run:()=>window.openFills(i)},
    {id:'x2', icon:'repeat', label:'Repeat ×' + ((sec?.repeats || 1) % 8 + 1), run:()=>window.cycleRepeats(i)},
    {id:'mod', icon:'half', label: sec?.mod ? 'Clear pre / post' : 'Mark as pre-', run:()=>window.setMod(i, sec?.mod ? sec.mod : 'pre')},
    ...(sec && hasOddBar(song, sec) ? [oddSkipItem(i, sec)] : []),
    ...(edAvailable() ? [{id:'cue', icon:'cue', label: sec?.time != null ? 'Clear cue' : 'Cue at play time',
          run:()=> sec?.time != null ? window.clearCue(i) : window.setCueHere(i)}] : []),
    '---',
    {id:'up', icon:'up', label:'Move up', disabled:i === 0, run:()=>window.moveSection(i, -1)},
    {id:'down', icon:'down', label:'Move down', disabled:i === n-1, run:()=>window.moveSection(i, 1)},
    {id:'top', icon:'top', label:'Move to top', disabled:i === 0, run:()=>window.moveSectionTo(i, 0)},
    {id:'bot', icon:'bottom', label:'Move to bottom', disabled:i === n-1, run:()=>window.moveSectionTo(i, n-1)},
    '---',
    {id:'del', icon:'trash', label:'Delete', key:KEYS.del, danger:true, run:()=>window.removeSection(i)},
  ];
}
window.openSectionMenu = function(ev, i){
  ev.stopPropagation();                           // the document click handler would close it straight away
  setSelectedSection(i);
  const r = ev.currentTarget.getBoundingClientRect();
  showCtx(r.right, r.bottom + 6, sectionMenuItems(i), { alignRight:true });
};
// the track's less-used actions, behind the ⋯ at the end of the transport row
window.openTrackMenu = function(ev){
  ev.stopPropagation();
  const song = currentSong(); if(!song || !song.audio) return;
  const yt = song.audio.type === 'youtube';
  const cued = song.sections.some(s => s.time != null);
  const r = ev.currentTarget.getBoundingClientRect();
  showCtx(r.right, r.bottom + 6, [
    {heading:true, label: yt ? 'YouTube track' : esc(song.audio.name || 'Audio file')},
    {id:'retap', icon:'restart', label:'Tap cues from the top', run:()=>window.editResetCueCursor()},
    {id:'clearcues', icon:'trash', label:'Clear every cue', danger:true, disabled:!cued, run:()=>window.clearAllCues()},
    '---',
    {id:'swap', icon:'upload', label: yt ? 'Use an audio file instead' : 'Swap audio file', run:()=>document.getElementById('audio-file-input').click()},
    {id:'rmtrack', icon:'x', label:'Remove track', danger:true, run:()=>window.removeAudio()},
  ], { alignRight:true });
};
// where a new section should land, based on where the menu was opened
function insertIndexFromPoint(clientY){
  const song = currentSong(); if(!song) return 0;
  const blocks = [...document.querySelectorAll('#chart-area .section-block')];
  for(const b of blocks){
    const r = b.getBoundingClientRect();
    if(clientY < r.top + r.height/2) return +b.dataset.idx;
  }
  return song.sections.length;
}
// leave a section's short bar out of the count, or put it back
function oddSkipItem(i, sec){
  const song = currentSong();
  return { id:'pickup', icon:'half',
           label: sec.oddSkip ? 'Count the ' + oddBarWords(song, sec) + ' again (they become bar 1)'
                              : "Don't count the " + oddBarWords(song, sec) + ' — make them a pickup',
           run:()=>window.toggleOddSkip(i) };
}
// the "Set this section to ▸" submenu — the type it already is sits disabled
function setTypeMenu(i, sec){
  return { id:'settype', icon:'edit', label:'Set this section to', submenu:
    TYPES.map(t => ({ id:'set-'+t.id, dot:t.color, label:t.label, disabled: sec && sec.typeId === t.id,
                      run:()=>window.setSectionType(i, t.id) })) };
}
// the "Add section ▸" submenu, with each type's colour swatch
function addSectionMenu(at){
  return { id:'addsec', icon:'plus', label:'Add section', submenu:
    TYPES.map(t => ({ id:'add-'+t.id, dot:t.color, label:t.label, key:t.key.toUpperCase(),
                      run:()=>window.addSectionAt(t.id, at) })) };
}
document.addEventListener('contextmenu', e => {
  // let text inputs keep their native copy/paste menu
  if(e.target.closest('input, textarea, select')) { hideCtx(); return; }
  if(e.target.closest('#settings-overlay')) { hideCtx(); return; }
  // the fills editor owns right-clicks while it's open
  if(e.target.closest('#fills-overlay')){
    const fillEl = e.target.closest('.ftl-fill:not(.ftl-ghost)');
    const oddEl = fillEl ? null : e.target.closest('.ftl-measure[data-odd]');
    if(oddEl && fillsIdx != null){
      e.preventDefault();
      const i = fillsIdx, sec = currentSong().sections[i];
      showCtx(e.clientX, e.clientY, [oddSkipItem(i, sec)]);
      return;
    }
    if(!fillEl || fillsIdx == null){ hideCtx(); return; }
    e.preventDefault();
    const i = fillsIdx, fi = +fillEl.dataset.fi;
    showCtx(e.clientX, e.clientY, [
      {id:'fd', icon:'dup', label:'Duplicate fill', run:()=>window.duplicateFill(i, fi)},
      {id:'fx', icon:'trash', label:'Delete fill', danger:true, run:()=>window.removeFill(i, fi)},
    ]);
    return;
  }
  // performance: the controls, plus a jump to the row that was right-clicked
  if(document.getElementById('perf-overlay').classList.contains('active')){
    e.preventDefault();
    const row = e.target.closest('.tp-row');
    showCtx(e.clientX, e.clientY, perfMenuItems(row ? +row.dataset.i : null));
    return;
  }
  const block = e.target.closest('#chart-list .section-block');
  const card = e.target.closest('.tile');
  if(block){
    e.preventDefault(); const i = +block.dataset.idx; setSelectedSection(i);
    showCtx(e.clientX, e.clientY, sectionMenuItems(i));
    return;
  }
  if(card){
    e.preventDefault();
    const id = +card.dataset.id;
    showCtx(e.clientX, e.clientY, [
      {id:'open', icon:'next', label:'Open', run:()=>window.openSong(id)},
      {id:'play', icon:'play', label:'Perform', run:()=>window.openAndPerform(id)},
      '---',
      {id:'dup', icon:'dup', label:'Duplicate', run:()=>window.duplicateSongById(id)},
      {id:'rename', icon:'edit', label:'Rename…', run:()=>window.renameSongById(id)},
      {id:'art', icon:'image', label:'Set cover art…', run:()=>window.pickCoverArt(id)},
      {id:'share', icon:'link', label:'Copy share link', run:()=>{ window.openSong(id); setTimeout(window.shareSong, 200); }},
      {id:'export', icon:'download', label:'Export this chart', run:()=>window.exportSongById(id)},
      '---',
      {id:'newsong', icon:'plus', label:'New song', run:()=>window.newSong()},
      '---',
      {id:'del', icon:'trash', label:'Delete', danger:true, run:()=>window.deleteSongById(id)},
    ]); return;
  }
  // empty editor area → undo/redo + quick add / paste / whole-chart actions
  if(document.getElementById('view-editor').classList.contains('active')){
    e.preventDefault();
    const nSec = (currentSong()?.sections || []).length;
    showCtx(e.clientX, e.clientY, [
      {id:'undo', icon:'undo', label:'Undo', key:KEYS.undo, disabled:!undoStack.length, run:()=>window.undoEdit()},
      {id:'redo', icon:'redo', label:'Redo', key:KEYS.redo, disabled:!redoStack.length, run:()=>window.redoEdit()},
      '---',
      addSectionMenu(insertIndexFromPoint(e.clientY)),
      {id:'pasteEnd', icon:'paste', label:'Paste section', key:KEYS.paste, disabled:!sectionClipboard, run:()=>window.pasteSection(nSec-1)},
      '---',
      {id:'share', icon:'link', label:'Copy share link', run:()=>window.shareSong()},
      {id:'perform', icon:'play', label:'Perform', disabled:!nSec, run:()=>window.startPerf()},
      '---',
      {id:'keys', icon:'keyboard', label:'Keyboard shortcuts', key:'/', run:()=>window.openShortcuts()},
    ]); return;
  }
  hideCtx();
});
document.addEventListener('click', e => { if(!e.target.closest('#ctx-menu')) hideCtx(); });
document.addEventListener('scroll', e => { if(e.target instanceof Element && (e.target.closest('#ctx-menu') || e.target.classList.contains('fm-wrap'))) return; hideCtx(); }, true);
window.addEventListener('blur', hideCtx);
window.addEventListener('resize', hideCtx);

// editor keyboard: the palette's section hotkeys, plus edits on the selected section
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){
    hideCtx();
    if(fillsIdx != null){ e.preventDefault(); window.closeFills(); return; }
    if(document.getElementById('settings-overlay').classList.contains('open')){ window.closeSettings(); return; }
  }
  if(!document.getElementById('view-editor').classList.contains('active')) return;
  if(document.getElementById('perf-overlay').classList.contains('active')) return;
  if(e.target instanceof Element && e.target.closest('input, textarea, select')) return;     // don't hijack typing
  const meta = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
  if(meta && k === 'z' && !e.shiftKey){ e.preventDefault(); window.undoEdit(); return; }
  if(meta && (k === 'y' || (e.shiftKey && k === 'z'))){ e.preventDefault(); window.redoEdit(); return; }
  // ← / → move the track 5s (Shift: 1s) — works in the fills editor too; without a track the arrows still scroll
  if(!meta && !e.altKey && (e.key === 'ArrowLeft' || e.key === 'ArrowRight') && edAvailable()){
    e.preventDefault();
    edNudge((e.key === 'ArrowLeft' ? -1 : 1) * (e.shiftKey ? 1 : 5));
    return;
  }
  if(fillsIdx != null){                                       // the fills editor owns the keyboard while it's open
    if(!meta && !e.altKey){
      if(e.key === '+' || e.key === '='){ e.preventDefault(); window.zoomFills(1); }
      else if(e.key === '-' || e.key === '_'){ e.preventDefault(); window.zoomFills(-1); }
      else if(e.key === '0'){ e.preventDefault(); window.fitFillZoom(); }
    }
    return;
  }
  if(document.getElementById('settings-overlay').classList.contains('open')) return;
  // , / . nudge the selected section's cue 10ms earlier / later (Shift: 100ms). By key code, so Shift still reads as , / .
  // match the physical key, and the character as a fallback for keyboards that don't report a code
  const nudgeDir = (e.code === 'Comma' || e.key === ',' || e.key === '<') ? -1
                 : (e.code === 'Period' || e.key === '.' || e.key === '>') ? 1 : 0;
  if(!meta && !e.altKey && nudgeDir){
    e.preventDefault();
    if(selectedSectionIdx == null){ showToast('Select a section to nudge its cue', 'error'); return; }
    nudgeCue(selectedSectionIdx, nudgeDir * (e.shiftKey ? 0.1 : 0.01));
    return;
  }
  if(!meta && !e.altKey && k === 't'){
    e.preventDefault();
    if(e.repeat) return;                                       // holding the key must not stamp a run of cues
    const song = currentSong();
    if(!edAvailable()){ showToast(song && song.audio ? 'Re-load the audio file first' : 'Add a track to tap cues', 'error'); return; }
    if(edCueIdx >= song.sections.length){ showToast('Every section is cued'); return; }
    window.editTapCue();
    return;
  }
  if(!meta && !e.altKey && e.key.length === 1){
    const t = TYPES.find(t => t.key === k);
    if(t){ e.preventDefault(); window.addSection(t.id); return; }
  }
  const i = selectedSectionIdx; if(i == null) return;
  if(meta && k === 'c'){ e.preventDefault(); window.copySection(i); }
  else if(meta && k === 'x'){ e.preventDefault(); window.cutSection(i); }
  else if(meta && k === 'v'){ e.preventDefault(); window.pasteSection(i); }
  else if(meta && k === 'd'){ e.preventDefault(); window.duplicateSection(i); }
  else if(e.key === 'Delete' || (meta && e.key === 'Backspace')){ e.preventDefault(); window.removeSection(i); selectedSectionIdx = null; }
});

// ─── KEYBOARD SHORTCUTS SHEET (/) ────────────────────
let shortcutsReturnFocus = null;
function renderShortcuts(){
  const K = (...keys) => keys.map(x => x === '+' ? '<span class="k-plus">+</span>' : `<kbd>${esc(x)}</kbd>`).join('');
  const M = IS_MAC ? '⌘' : 'Ctrl';
  const row = (desc, keys) => `<div class="k-row"><span class="k-desc">${desc}</span><span class="k-keys">${keys}</span></div>`;
  const group = (title, body) => `<section class="k-group"><h3>${title}</h3>${body}</section>`;
  const perform = group('Performing',
    row('Play or pause', K('Space')) +
    row('Back or forward 5 seconds', K('←', '→')) +
    row('Back or forward 1 second', K('⇧', '+', '←', '→')) +
    row('Previous or next section', K('↑', '↓')) +
    row('Full screen', K('F')) +
    row('Jump to a section or a fill', '<span class="k-click">click a row or a fill</span>') +
    row('Leave performance', K('Esc')));
  const track = group('Track and cues',
    row('Play or pause the track', K('Space')) +
    row('Tap the next cue', K('T')) +
    row('Nudge the selected cue 10 ms', K(',', '.')) +
    row('Nudge it 100 ms', K('⇧', '+', ',', '.')) +
    row('Move the track 5 seconds', K('←', '→')) +
    row('Move it 1 second', K('⇧', '+', '←', '→')));
  const editing = group('Editing',
    row('Undo', K(M, 'Z')) +
    row('Redo', IS_MAC ? K('⇧', '⌘', 'Z') : K('Ctrl', 'Y')) +
    row('Duplicate the selected section', K(M, 'D')) +
    row('Copy it', K(M, 'C')) +
    row('Cut it', K(M, 'X')) +
    row('Paste below it', K(M, 'V')) +
    row('Delete it', IS_MAC ? K('⌘', '⌫') : K('Del')) +
    row('Count repeats down', K('⇧', '+') + '<span class="k-click">click ×N</span>') +
    row('Add a fill in the fills lane', '<span class="k-click">double-click</span>') +
    row('Move the playhead in the fills lane', '<span class="k-click">click</span>') +
    row('Zoom the fills lane', '<span class="k-click">scroll</span><kbd>+</kbd><kbd>&minus;</kbd>') +
    row('Fit the whole section in the lane', K('0')) +
    row('Close the fills editor or a menu', K('Esc')));
  const add = group('Add a section', '<div class="k-pal">' +
    TYPES.map(t => `<span style="--sec:${t.color}"><kbd>${t.key.toUpperCase()}</kbd><i></i>${t.label}</span>`).join('') + '</div>');
  const performing = document.getElementById('perf-overlay').classList.contains('active');
  return `<div class="k-head">
      <div class="k-titles"><div class="k-title" id="keys-title">Keyboard shortcuts</div><div class="k-sub">Press <kbd>/</kbd> to open or close</div></div>
      <button type="button" class="circ" onclick="closeShortcuts()" title="Close (Esc)" aria-label="Close shortcuts">${ico('x')}</button>
    </div>
    <div class="k-grid">${performing ? perform + track + editing + add : track + editing + add + perform}</div>`;
}
window.openShortcuts = function(){
  hideCtx();
  const ov = document.getElementById('keys-overlay');
  shortcutsReturnFocus = document.activeElement;
  document.getElementById('keys-box').innerHTML = renderShortcuts();
  ov.classList.add('open'); ov.setAttribute('aria-hidden', 'false');
  document.getElementById('keys-box').focus({ preventScroll:true });
};
window.closeShortcuts = function(){
  const ov = document.getElementById('keys-overlay');
  if(!ov.classList.contains('open')) return;
  ov.classList.remove('open'); ov.setAttribute('aria-hidden', 'true');
  if(shortcutsReturnFocus && shortcutsReturnFocus.focus) shortcutsReturnFocus.focus({ preventScroll:true });
  shortcutsReturnFocus = null;
};
{
  const ov = document.getElementById('keys-overlay');
  let downOnBackdrop = false;
  ov.addEventListener('pointerdown', e => { downOnBackdrop = e.target === ov; });
  ov.addEventListener('click', e => { if(e.target === ov && downOnBackdrop) window.closeShortcuts(); });
  // Space plays / pauses the track from anywhere it's loaded — the editor, the fills editor, settings,
  // an open menu, this sheet, performing. Registered first so nothing in front of it swallows the key.
  let spaceHandled = false;
  window.addEventListener('keydown', e => {
    if(!(e.key === ' ' || e.code === 'Space') || e.ctrlKey || e.metaKey || e.altKey) return;
    if(e.target instanceof Element && e.target.closest('input, textarea, select, [contenteditable]')) return;   // typing a space
    const performing = document.getElementById('perf-overlay').classList.contains('active');
    const editing = document.getElementById('view-editor').classList.contains('active');
    if(!(performing ? audioAvailable() : editing && edAvailable())) return;
    e.preventDefault(); e.stopImmediatePropagation();
    spaceHandled = true;
    if(e.repeat) return;                                         // holding it mustn't flicker play / pause
    if(performing) window.toggleAudioPlay(); else window.edPlayPause();
  }, true);
  // a focused button would otherwise also "click" when Space comes back up
  window.addEventListener('keyup', e => {
    if((e.key === ' ' || e.code === 'Space') && spaceHandled){ e.preventDefault(); e.stopImmediatePropagation(); spaceHandled = false; }
  }, true);
  // capture phase, so the sheet sees keys before the editor and performance handlers do
  window.addEventListener('keydown', e => {
    const slash = (e.key === '/' || e.key === '?' || e.code === 'Slash') && !e.ctrlKey && !e.metaKey && !e.altKey;
    if(ov.classList.contains('open')){
      if(e.key === 'Tab') return;
      e.preventDefault(); e.stopImmediatePropagation();          // it's modal: nothing behind it reacts (Esc mustn't also leave performance)
      if(e.key === 'Escape' || slash) window.closeShortcuts();
      return;
    }
    if(!slash) return;
    if(e.target instanceof Element && e.target.closest('input, textarea, select, [contenteditable]')) return;
    if(document.getElementById('view-auth').classList.contains('active')) return;
    e.preventDefault(); e.stopImmediatePropagation();            // also keeps Firefox's quick-find out of the way
    window.openShortcuts();
  }, true);
}

checkSharedLink();
